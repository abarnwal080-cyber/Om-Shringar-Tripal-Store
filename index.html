    <!-- Preloader Auto-dismiss and Scroll Lock Control Script -->
    <script>
      (function() {
        // Lock page scroll while loader is active
        document.documentElement.classList.add('preloader-active');
        document.body.classList.add('preloader-active');

        // Play video programmatically if muted autoplay policy requires explicit trigger
        var video = document.querySelector('.preloader-video');
        if (video) {
          video.muted = true;
          video.play().catch(function(err) {
            console.log('Video autoplay trigger:', err);
          });
        }

        // Hide preloader automatically after 4 seconds with smooth fade-out
        function hidePreloader() {
          var preloader = document.getElementById('premium-preloader');
          if (preloader && !preloader.classList.contains('fade-out')) {
            preloader.classList.add('fade-out');
            
            setTimeout(function() {
              preloader.remove();
              document.documentElement.classList.remove('preloader-active');
              document.body.classList.remove('preloader-active');
            }, 600);
          }
        }

        setTimeout(hidePreloader, 4000);
      })();
    </script>
