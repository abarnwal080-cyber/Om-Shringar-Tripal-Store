          animation:

          shieldRotate 5s linear infinite;
          transform-style: preserve-3d;

          content: "";

          inset: 10px;

          content: "";

          width: 24px;
          height: 24px;
          border-radius: 50%;
          background: #fff;
          top: 24px;
          left: 50%;
          transform: translateX(-50%);

          carouselInterval = setInterval(function() {
            brandItems[currentBrand].classList.remove('active');
            currentBrand = (currentBrand + 1) % brandItems.length;
            brandItems[currentBrand].classList.add('active');
          }, 250); // Fast 250ms rotation for 1-by-1 logo switching
        }

        // Action to trigger preloader fade out and complete DOM removal
        function hidePreloader() {
          var preloader = document.getElementById('premium-preloader');
          if (preloader) {
            preloader.classList.add('fade-out');
            if (carouselInterval) clearInterval(carouselInterval);
            
            // Clean up from DOM once transition completes
            setTimeout(function() {
              preloader.remove();
            }, 600);
          }
        }

        // Logic to coordinate load event and timer
        function checkAndHide() {
          var elapsedTime = Date.now() - startTime;
          var minDuration = 4000; // Keep showing for 4 seconds (4000ms)
          
          if (elapsedTime >= minDuration) {
            hidePreloader();
          } else {
            setTimeout(hidePreloader, minDuration - elapsedTime);
          }
        }

        // Normal full load completion
        window.addEventListener('load', function() {
          isPageLoaded = true;
          checkAndHide();
        });

        // Fail-safe backup trigger (maximum 6 seconds load delay safeguard)
        setTimeout(function() {
          if (!isPageLoaded) {
            hidePreloader();
          }
        }, 6000);
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
